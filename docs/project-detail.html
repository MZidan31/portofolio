<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Study — Muhammad Zidan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
            background-color: #F8F9FC;
            color: #1D1D1F;
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(at 15% 8%, rgba(0, 113, 227, 0.07) 0px, transparent 50%),
                radial-gradient(at 85% 15%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
        }
        .apple-nav {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.07);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
        }
        .prose-apple h2, .prose-apple h3 { font-weight: 700; color: #1D1D1F; margin-top: 2rem; margin-bottom: 0.75rem; letter-spacing: -0.02em; }
        .prose-apple h2 { font-size: 1.5rem; }
        .prose-apple h3 { font-size: 1.25rem; }
        .prose-apple p { color: #3A3A3C; line-height: 1.75; margin-bottom: 1.15rem; font-size: 1.02rem; }
        .prose-apple ul, .prose-apple ol { margin-left: 1.5rem; margin-bottom: 1.25rem; color: #3A3A3C; line-height: 1.7; }
        .prose-apple ul { list-style-type: disc; }
        .prose-apple ol { list-style-type: decimal; }
        .prose-apple table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; background: #FFF; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .prose-apple th { background: #F2F4F8; font-weight: 600; text-align: left; padding: 12px 16px; font-size: 0.875rem; color: #1D1D1F; border-bottom: 1px solid #E5E7EB; }
        .prose-apple td { padding: 12px 16px; font-size: 0.9rem; border-bottom: 1px solid #F1F5F9; color: #3A3A3C; }
        .prose-apple blockquote { border-left: 3px solid #0071E3; padding-left: 1rem; color: #515154; font-style: italic; margin: 1.5rem 0; }

        /* Tombol Save as PDF di Navbar */
        .apple-pdf-btn {
            background: #0071E3 !important;
            color: #FFFFFF !important;
            font-size: 12px !important;
            font-weight: 600 !important;
            padding: 7px 14px !important;
            border-radius: 999px !important;
            border: none !important;
            cursor: pointer !important;
            display: inline-flex !important;
            align-items: center !important;
            gap: 5px !important;
            transition: background 0.2s ease, transform 0.15s ease !important;
        }
        .apple-pdf-btn:hover { background: #0077ED !important; transform: scale(1.03); }

        .pdf-formal-header { display: none; }

        /* ==================== ATURAN CETAK PDF RAPI (ANTI-RUSAK) ==================== */
        @media print {
            @page {
                size: A4 portrait;
                margin: 16mm 16mm 18mm 16mm;
            }
            html, body {
                background: #FFFFFF !important;
                background-image: none !important;
                color: #1D1D1F !important;
                padding: 0 !important;
                margin: 0 !important;
                font-size: 11pt !important;
                line-height: 1.6 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            nav, .apple-nav, #action-bar, #ios-project-lightbox, button, .no-print {
                display: none !important;
            }
            .pdf-formal-header {
                display: flex !important;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1.5px solid #E5E7EB;
                padding-bottom: 10px;
                margin-bottom: 20px;
                font-size: 9pt;
                color: #6E6E73;
            }
            main, article {
                max-width: 100% !important;
                width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
                background: #FFFFFF !important;
                box-shadow: none !important;
                border: none !important;
                border-radius: 0 !important;
            }
            header {
                text-align: left !important;
                padding: 0 0 16px 0 !important;
                margin: 0 0 20px 0 !important;
                border-bottom: 1px solid #F1F5F9 !important;
                max-width: 100% !important;
            }
            header h1 { font-size: 22pt !important; line-height: 1.2 !important; margin-bottom: 6px !important; }
            header p { font-size: 10.5pt !important; color: #515154 !important; }
            h1, h2, h3, h4 { break-after: avoid !important; page-break-after: avoid !important; color: #1D1D1F !important; }
            h2 { font-size: 14pt !important; margin-top: 20px !important; }
            h3 { font-size: 12pt !important; margin-top: 16px !important; }
            img, figure, table, tr, blockquote, .gallery-card {
                break-inside: avoid !important;
                page-break-inside: avoid !important;
            }
            img {
                max-height: 290px !important;
                width: auto !important;
                max-width: 100% !important;
                object-fit: contain !important;
                margin: 10px auto !important;
                border: 1px solid #E5E7EB !important;
                border-radius: 10px !important;
            }
            #proj-gallery {
                display: grid !important;
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 12px !important;
            }
            table { width: 100% !important; border: 1px solid #D1D5DB !important; font-size: 9.5pt !important; box-shadow: none !important; }
            thead { display: table-header-group !important; }
            th { background-color: #F3F4F6 !important; color: #111827 !important; padding: 8px 10px !important; border-bottom: 1px solid #D1D5DB !important; }
            td { padding: 7px 10px !important; border-bottom: 1px solid #E5E7EB !important; }
        }
    </style>
</head>
<body class="antialiased pb-24">

    <nav class="fixed top-4 left-1/2 transform -translate-x-1/2 w-[92%] max-w-4xl z-50 apple-nav rounded-full px-5 py-3 flex justify-between items-center">
        <a href="./#projects" class="inline-flex items-center gap-1.5 text-sm font-semibold text-[#0071E3] hover:opacity-80 transition">
            <i class='bx bx-chevron-left text-xl'></i> Back to Portfolio
        </a>
        <span class="hidden sm:inline text-xs font-bold tracking-wider uppercase text-slate-400">Case Study</span>
        <div class="inline-flex items-center gap-2">
            <button type="button" onclick="exportCaseStudyPDF()" class="apple-pdf-btn">
                <i class='bx bxs-file-pdf' style="font-size:15px;"></i> Save PDF
            </button>
            <a href="./#contact" class="bg-[#1D1D1F] text-white text-xs font-semibold px-4 py-1.5 rounded-full hover:bg-[#0071E3] transition">
                Let's Talk
            </a>
        </div>
    </nav>

    <main class="pt-28 px-5 sm:px-8 max-w-4xl mx-auto">
        <header class="text-center max-w-3xl mx-auto mb-10">
            <span class="inline-block px-3.5 py-1 rounded-full bg-blue-50 text-[#0071E3] text-xs font-bold uppercase tracking-wider mb-4">Project Case Study</span>
            <h1 id="proj-title" class="text-3xl sm:text-5xl font-extrabold text-[#1D1D1F] tracking-tight leading-tight mb-4">Memuat Studi Kasus...</h1>
            <p id="proj-desc" class="text-base sm:text-lg text-[#515154] leading-relaxed"></p>
        </header>

        <div id="cover-wrapper" class="hidden mb-12 rounded-[28px] overflow-hidden shadow-xl border border-black/5 bg-white cursor-zoom-in" onclick="window.openSingleImageLightbox(document.getElementById('proj-cover').src, document.getElementById('proj-title').innerText)">
            <img id="proj-cover" src="" alt="Project Cover" class="w-full max-h-[480px] object-cover hover:scale-[1.01] transition-transform duration-500">
        </div>

        <div id="action-bar" class="hidden flex flex-wrap justify-center gap-3 mb-12">
            <a id="proj-pdf" href="#" target="_blank" class="hidden inline-flex items-center gap-2 bg-[#0071E3] text-white px-6 py-3 rounded-full text-sm font-semibold hover:bg-[#0077ED] transition shadow-md shadow-blue-500/20">
                <i class='bx bxs-file-pdf text-lg'></i> View Full Report (PDF)
            </a>
            <a id="proj-link" href="#" target="_blank" class="hidden inline-flex items-center gap-2 bg-white text-[#1D1D1F] border border-black/10 px-6 py-3 rounded-full text-sm font-semibold hover:bg-gray-50 transition">
                <i class='bx bx-link-external text-lg text-[#0071E3]'></i> Open Repository / Demo
            </a>
        </div>

        <article class="bg-white rounded-[32px] p-7 sm:p-12 shadow-sm border border-black/5">
            <div id="proj-content" class="prose-apple">
                <p class="text-center text-slate-400">Mengambil detail studi kasus...</p>
            </div>

            <div id="gallery-section" class="hidden mt-14 pt-10 border-t border-black/5">
                <h3 class="text-xl font-bold text-[#1D1D1F] mb-6">Documentation & Visuals</h3>
                <div id="proj-gallery" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </div>
        </article>
    </main>

    <!-- ==================== Single Unified iOS Lightbox ==================== -->
    <div id="ios-project-lightbox" class="hidden fixed inset-0 z-[9999] bg-black/90 backdrop-blur-2xl flex flex-col justify-between p-4 sm:p-6 select-none" onclick="window.closeProjectLightbox()">
        <!-- Top Bar -->
        <div class="max-w-6xl w-full mx-auto flex items-center justify-between gap-4" onclick="event.stopPropagation()">
            <span id="lb-counter" class="px-3.5 py-1 rounded-full bg-white/10 text-white/80 text-xs font-semibold tracking-wide"></span>
            <button type="button" onclick="window.closeProjectLightbox()" class="w-9 h-9 rounded-full bg-white/15 hover:bg-white/25 text-white flex items-center justify-center text-xl transition">&times;</button>
        </div>

        <!-- Center Image Stage -->
        <div class="relative flex-1 flex items-center justify-center my-3 overflow-hidden" onclick="event.stopPropagation()">
            <button type="button" id="lb-prev-btn" onclick="window.prevProjectPhoto()" class="absolute left-1 sm:left-4 z-10 w-11 h-11 rounded-full bg-white/15 hover:bg-white/30 text-white flex items-center justify-center text-2xl backdrop-blur-md transition">
                <i class='bx bx-chevron-left'></i>
            </button>

            <div class="max-h-[75vh] max-w-[90vw] overflow-auto rounded-2xl shadow-2xl border border-white/15 bg-black/40 flex items-center justify-center">
                <img id="lb-stage-img" src="" alt="Preview" onclick="this.classList.toggle('scale-150'); this.classList.toggle('cursor-zoom-out');" class="max-h-[73vh] max-w-[88vw] object-contain cursor-zoom-in transition-transform duration-300">
            </div>

            <button type="button" id="lb-next-btn" onclick="window.nextProjectPhoto()" class="absolute right-1 sm:right-4 z-10 w-11 h-11 rounded-full bg-white/15 hover:bg-white/30 text-white flex items-center justify-center text-2xl backdrop-blur-md transition">
                <i class='bx bx-chevron-right'></i>
            </button>
        </div>

        <!-- Bottom Caption -->
        <div class="max-w-3xl w-full mx-auto text-center space-y-1" onclick="event.stopPropagation()">
            <p id="lb-caption" class="text-white text-sm sm:text-base font-medium leading-relaxed"></p>
            <p class="text-white/45 text-[11px]">Klik gambar untuk Zoom &bull; Gunakan panah keyboard &larr; &rarr; untuk geser</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://rnjzmdondbnkmmiexnzg.supabase.co';
        const supabaseKey = 'sb_publishable_0cOoMiEnxmakBCaJetNw7w_dI3yOTeE';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let projectGalleryItems = [];
        let activeLightboxList = [];
        let currentLightboxIdx = 0;

        window.openProjectLightbox = function(index) {
            if (!projectGalleryItems.length) return;
            activeLightboxList = projectGalleryItems;
            currentLightboxIdx = index;
            renderLightboxStage();
            document.getElementById('ios-project-lightbox').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };

        window.openSingleImageLightbox = function(url, caption) {
            if (!url) return;
            activeLightboxList = [{ url, caption }];
            currentLightboxIdx = 0;
            renderLightboxStage();
            document.getElementById('ios-project-lightbox').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };

        window.closeProjectLightbox = function() {
            document.getElementById('ios-project-lightbox').classList.add('hidden');
            document.body.style.overflow = '';
        };

        function renderLightboxStage() {
            const item = activeLightboxList[currentLightboxIdx];
            const img = document.getElementById('lb-stage-img');
            img.classList.remove('scale-150', 'cursor-zoom-out');
            img.src = item.url;
            document.getElementById('lb-caption').innerText = item.caption || `Dokumentasi #${currentLightboxIdx + 1}`;
            document.getElementById('lb-counter').innerText = `${currentLightboxIdx + 1} / ${activeLightboxList.length}`;

            const showNav = activeLightboxList.length > 1;
            document.getElementById('lb-prev-btn').style.display = showNav ? 'flex' : 'none';
            document.getElementById('lb-next-btn').style.display = showNav ? 'flex' : 'none';
        }

        window.nextProjectPhoto = function() {
            if (activeLightboxList.length <= 1) return;
            currentLightboxIdx = (currentLightboxIdx + 1) % activeLightboxList.length;
            renderLightboxStage();
        };

        window.prevProjectPhoto = function() {
            if (activeLightboxList.length <= 1) return;
            currentLightboxIdx = (currentLightboxIdx - 1 + activeLightboxList.length) % activeLightboxList.length;
            renderLightboxStage();
        };

        document.addEventListener('keydown', (e) => {
            const modal = document.getElementById('ios-project-lightbox');
            if (!modal || modal.classList.contains('hidden')) return;
            if (e.key === 'Escape') window.closeProjectLightbox();
            if (e.key === 'ArrowRight') window.nextProjectPhoto();
            if (e.key === 'ArrowLeft') window.prevProjectPhoto();
        });

        function exportCaseStudyPDF() {
            if (!document.querySelector('.pdf-formal-header')) {
                const pdfHeader = document.createElement('div');
                pdfHeader.className = 'pdf-formal-header';
                const today = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
                pdfHeader.innerHTML = `
                    <span><strong>MUHAMMAD ZIDAN</strong> &bull; Portfolio Case Study</span>
                    <span>Generated on ${today}</span>
                `;
                document.body.prepend(pdfHeader);
            }
            window.print();
        }

        // ==================== LOAD PROJECT DATA ====================
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            let query = supabaseClient.from('projects').select('*');
            if (id) {
                query = query.eq('id', id).single();
            } else {
                query = query.order('created_at', { ascending: false }).limit(1).single();
            }

            const { data: proj } = await query;
            if (proj) {
                document.title = `${proj.title} — Muhammad Zidan`;
                document.getElementById('proj-title').innerText = proj.title;
                document.getElementById('proj-desc').innerText = proj.description || '';
                document.getElementById('proj-content').innerHTML = proj.content || '<p>Tidak ada deskripsi detail.</p>';

                if (proj.image_url) {
                    document.getElementById('proj-cover').src = proj.image_url;
                    document.getElementById('cover-wrapper').classList.remove('hidden');
                }

                const repoLink = proj.repo_url || proj.link;
                if (proj.pdf_url || repoLink) {
                    document.getElementById('action-bar').classList.remove('hidden');
                    if (proj.pdf_url) {
                        const pdfBtn = document.getElementById('proj-pdf');
                        pdfBtn.href = proj.pdf_url;
                        pdfBtn.classList.remove('hidden');
                    }
                    if (repoLink) {
                        const linkBtn = document.getElementById('proj-link');
                        linkBtn.href = repoLink;
                        linkBtn.classList.remove('hidden');
                    }
                }

                // Render Galeri Dokumentasi & Caption
                let rawGallery = proj.gallery;
                if (typeof rawGallery === 'string') {
                    try { rawGallery = JSON.parse(rawGallery); } catch (e) { rawGallery = []; }
                }

                const gallerySection = document.getElementById('gallery-section');
                const galleryContainer = document.getElementById('proj-gallery');

                if (Array.isArray(rawGallery) && rawGallery.length > 0 && galleryContainer) {
                    projectGalleryItems = rawGallery.map(item => ({
                        url: typeof item === 'string' ? item : item.url,
                        caption: typeof item === 'string' ? '' : (item.caption || '')
                    }));

                    if (gallerySection) gallerySection.classList.remove('hidden');
                    galleryContainer.innerHTML = '';

                    projectGalleryItems.forEach((item, idx) => {
                        galleryContainer.innerHTML += `
                            <figure class="gallery-card group bg-white rounded-2xl border border-black/5 overflow-hidden shadow-xs hover:shadow-md transition cursor-zoom-in flex flex-col"
                                onclick="window.openProjectLightbox(${idx})">
                                <div class="bg-slate-50 overflow-hidden">
                                    <img src="${item.url}" alt="${item.caption || 'Dokumentasi ' + (idx + 1)}" loading="lazy"
                                        class="w-full h-auto object-contain group-hover:scale-[1.02] transition-transform duration-500">
                                </div>
                                ${item.caption ? `<figcaption class="p-3.5 text-xs text-slate-600 leading-relaxed border-t border-black/5 bg-white">${item.caption}</figcaption>` : ''}
                            </figure>
                        `;
                    });
                }
            } else {
                document.getElementById('proj-title').innerText = 'Proyek Tidak Ditemukan';
                document.getElementById('proj-content').innerHTML = '<p class="text-center text-slate-500">Data proyek belum tersedia atau telah dihapus.</p>';
            }
        });
    </script>
</body>
</html>
