<body class="antialiased pb-24">

    <nav class="fixed top-4 left-1/2 transform -translate-x-1/2 w-[92%] max-w-4xl z-50 apple-nav rounded-full px-5 py-3 flex justify-between items-center">

            <p id="proj-desc" class="text-base sm:text-lg text-[#515154] leading-relaxed"></p>
        </header>

        <div id="cover-wrapper" class="hidden mb-12 rounded-[28px] overflow-hidden shadow-xl border border-black/5 bg-white">
            <img id="proj-cover" src="" alt="Project Cover" class="w-full max-h-[480px] object-cover">
        </div>

        <div id="action-bar" class="hidden flex flex-wrap justify-center gap-3 mb-12">
            <a id="proj-pdf" href="#" target="_blank" class="hidden inline-flex items-center gap-2 bg-[#0071E3] text-white px-6 py-3 rounded-full text-sm font-semibold hover:bg-[#0077ED] transition shadow-md shadow-blue-500/20">

            <a id="proj-link" href="#" target="_blank" class="hidden inline-flex items-center gap-2 bg-white text-[#1D1D1F] border border-black/10 px-6 py-3 rounded-full text-sm font-semibold hover:bg-gray-50 transition">
                <i class='bx bx-link-external text-lg text-[#0071E3]'></i> Open Repository / Demo
            </a>
        </div>

        <article class="bg-white rounded-[32px] p-7 sm:p-12 shadow-sm border border-black/5">
            <div id="proj-content" class="prose-apple">
                <p class="text-center text-slate-400">Mengambil detail studi kasus...</p>
            </div>

            <div id="gallery-section" class="hidden mt-14 pt-10 border-t border-black/5">
                <h3 class="text-xl font-bold text-[#1D1D1F] mb-6">Documentation & Visuals</h3>
                <div id="proj-gallery" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            </div>
        </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://rnjzmdondbnkmmiexnzg.supabase.co';
        const supabaseKey = 'sb_publishable_0cOoMiEnxmakBCaJetNw7w_dI3yOTeE';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            let query = supabaseClient.from('projects').select('*');
            if (id) {
                query = query.eq('id', id).single();
            } else {
                // Fallback jika server lokal menghapus ?id= saat redirect
                query = query.order('created_at', { ascending: false }).limit(1).single();
            }

            const { data: proj, error } = await query;
            if (proj) {
                document.title = `${proj.title} — Muhammad Zidan`;
                document.getElementById('proj-title').innerText = proj.title;
                document.getElementById('proj-desc').innerText = proj.description || '';
                document.getElementById('proj-content').innerHTML = proj.content || '<p>Tidak ada deskripsi detail.</p>';

                if (proj.image_url) {
                    document.getElementById('proj-cover').src = proj.image_url;
                    document.getElementById('cover-wrapper').classList.remove('hidden');
                }
                if (proj.pdf_url || proj.link) {
                    document.getElementById('action-bar').classList.remove('hidden');
                    if (proj.pdf_url) {
                        const pdfBtn = document.getElementById('proj-pdf');
                        pdfBtn.href = proj.pdf_url;
                        pdfBtn.classList.remove('hidden');
                    }
                    if (proj.link) {
                        const linkBtn = document.getElementById('proj-link');
                        linkBtn.href = proj.link;
                        linkBtn.classList.remove('hidden');
                    }
                }
                if (proj.gallery && proj.gallery.length > 0) {
                    document.getElementById('gallery-section').classList.remove('hidden');
                    const galContainer = document.getElementById('proj-gallery');
                    proj.gallery.forEach(item => {
                        galContainer.innerHTML += `
                            <div class="rounded-2xl overflow-hidden border border-black/5 bg-[#F8F9FC]">
                                <img src="${item.image_url}" alt="${item.caption || ''}" class="w-full h-56 object-cover">
                                ${item.caption ? `<p class="p-3.5 text-xs font-medium text-[#515154]">${item.caption}</p>` : ''}
                            </div>
                        `;
                    });
                }
            } else {
                document.getElementById('proj-title').innerText = 'Proyek Tidak Ditemukan';
                document.getElementById('proj-content').innerHTML = '<p class="text-center text-slate-500">Data proyek belum tersedia atau telah dihapus.</p>';
            }
        });
    </script>
    <!-- ==================== iOS Photos / Quick Look Lightbox ==================== -->
<style>
    .apple-zoomable {
        cursor: zoom-in !important;
        transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease !important;
    }
    .apple-zoomable:hover {
        transform: scale(1.015) !important;
        box-shadow: 0 14px 30px rgba(0, 113, 227, 0.14) !important;
    }
    #ios-lightbox {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: rgba(15, 15, 18, 0.82);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #ios-lightbox.active {
        opacity: 1;
        pointer-events: auto;
    }
    .ios-lb-toolbar {
        position: fixed;
        top: 20px;
        right: 24px;
        display: flex;
        gap: 10px;
        z-index: 100001;
    }
    .ios-lb-btn {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        background: rgba(44, 44, 46, 0.72);
        backdrop-filter: blur(12px);
        color: #FFFFFF;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.15s ease;
    }
    .ios-lb-btn:hover { background: rgba(72, 72, 74, 0.9); transform: scale(1.06); }
    .ios-lb-stage {
        max-width: 92vw;
        max-height: 80vh;
        overflow: auto;
        border-radius: 22px;
        box-shadow: 0 28px 70px rgba(0, 0, 0, 0.55);
        background: #FFFFFF;
        transform: scale(0.94);
        transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #ios-lightbox.active .ios-lb-stage { transform: scale(1); }
    #ios-lb-img {
        display: block;
        max-width: 90vw;
        max-height: 78vh;
        width: auto;
        height: auto;
        margin: 0 !important;
        border: none !important;
        border-radius: 0 !important;
        cursor: zoom-in;
        transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        transform-origin: center center;
    }
    #ios-lb-img.zoomed {
        max-width: none;
        max-height: none;
        width: 145vw;
        cursor: zoom-out;
    }
    .ios-lb-caption {
        margin-top: 16px;
        padding: 8px 18px;
        border-radius: 999px;
        background: rgba(44, 44, 46, 0.75);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #F5F5F7;
        font-size: 13px;
        font-weight: 500;
        text-align: center;
        max-width: 85vw;
    }
</style>

<div id="ios-lightbox" onclick="closeIosLightbox()">
    <div class="ios-lb-toolbar" onclick="event.stopPropagation()">
        <button type="button" class="ios-lb-btn" onclick="toggleIosZoom()" title="Perbesar / Perkecil (Zoom)">
            <i id="ios-lb-zoom-icon" class='bx bx-zoom-in'></i>
        </button>
        <button type="button" class="ios-lb-btn" onclick="closeIosLightbox()" title="Tutup (Esc)">
            <i class='bx bx-x'></i>
        </button>
    </div>
    <div class="ios-lb-stage" onclick="event.stopPropagation()">
        <img id="ios-lb-img" src="" alt="Preview" onclick="toggleIosZoom()">
    </div>
    <div id="ios-lb-caption" class="ios-lb-caption hidden"></div>
</div>

<script>
    const lbModal = document.getElementById('ios-lightbox');
    const lbImg = document.getElementById('ios-lb-img');
    const lbCap = document.getElementById('ios-lb-caption');
    const lbZoomIcon = document.getElementById('ios-lb-zoom-icon');

    function openIosLightbox(src, captionText) {
        lbImg.src = src;
        lbImg.classList.remove('zoomed');
        lbZoomIcon.className = 'bx bx-zoom-in';
        if (captionText && captionText.trim() !== '') {
            lbCap.innerText = captionText.trim();
            lbCap.classList.remove('hidden');
        } else {
            lbCap.classList.add('hidden');
        }
        lbModal.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeIosLightbox() {
        lbModal.classList.remove('active');
        document.body.style.overflow = '';
    }

    function toggleIosZoom() {
        const isZoomed = lbImg.classList.toggle('zoomed');
        lbZoomIcon.className = isZoomed ? 'bx bx-zoom-out' : 'bx bx-zoom-in';
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeIosLightbox();
    });

    // Otomatis aktifkan klik-perbesar pada semua gambar proyek (termasuk yang dimuat dinamis dari Supabase)
    function attachLightboxToImages() {
        document.querySelectorAll('main img, .container img, article img, figure img').forEach(img => {
            if (img.id === 'ios-lb-img' || img.dataset.lbBound) return;
            img.dataset.lbBound = 'true';
            img.classList.add('apple-zoomable');
            img.addEventListener('click', () => {
                // Ambil caption dari teks di bawah gambar atau atribut alt
                const parentCard = img.closest('figure, .gallery-card, div');
                const captionEl = parentCard ? parentCard.querySelector('figcaption, p') : null;
                const cap = (captionEl && captionEl.innerText.length < 120) ? captionEl.innerText : (img.alt || '');
                openIosLightbox(img.src, cap);
            });
        });
    }

    attachLightboxToImages();
    const imgObserver = new MutationObserver(attachLightboxToImages);
    imgObserver.observe(document.body, { childList: true, subtree: true });
</script>

<style>
    /* Tombol Save as PDF di Navbar */
    .apple-pdf-btn {
        background: #0071E3 !important;
        color: #FFFFFF !important;
        font-size: 12px !important;
        font-weight: 600 !important;
        padding: 7px 14px !important;
        border-radius: 999px !important;

    /* Kop Dokumen Khusus Cetak PDF (Tersembunyi di Layar Web) */

    /* ==================== ATURAN CETAK PDF RAPI (ANTI-RUSAK) ==================== */
    @media print {
        @page {
            size: A4 portrait;
            margin: 16mm 16mm 18mm 16mm;
        }

        /* Reset Latar Belakang & Efek Web */
        html, body {
            background: #FFFFFF !important;

            color: #1D1D1F !important;
            padding: 0 !important;

            font-size: 11pt !important;

        }

        /* Sembunyikan Elemen Interaktif Web */
        nav, .apple-nav, .apple-top-nav, #action-bar, #ios-lightbox, button, .no-print {
            display: none !important;
        }

        /* Tampilkan Kop Dokumen Resmi di Halaman 1 */
        .pdf-formal-header {
            display: flex !important;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1.5px solid #E5E7EB;
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 9pt;
            color: #6E6E73;
        }

        /* Rapikan Container Utama agar Penuh ke Lebar Kertas A4 */
        main, .container, article, section.content, .card {
            max-width: 100% !important;
            width: 100% !important;
            padding: 0 !important;
            margin: 0 !important;
            background: #FFFFFF !important;
            box-shadow: none !important;
            border: none !important;
            border-radius: 0 !important;
        }

        header {
            text-align: left !important;
            padding: 0 0 16px 0 !important;
            margin: 0 0 20px 0 !important;
            border-bottom: 1px solid #F1F5F9 !important;
            max-width: 100% !important;
        }
        header h1 {
            font-size: 22pt !important;
            line-height: 1.2 !important;
            margin-bottom: 6px !important;
        }
        header p {
            font-size: 10.5pt !important;
            color: #515154 !important;
        }

        /* Cegah Judul Terpisah dari Paragraf di Bawahnya */
        h1, h2, h3, h4 {
            break-after: avoid !important;
            page-break-after: avoid !important;
            color: #1D1D1F !important;
        }
        h2 { font-size: 14pt !important; margin-top: 20px !important; }
        h3 { font-size: 12pt !important; margin-top: 16px !important; }

        /* KUNCI UTAMA ANTI-POTONG: Gambar, Tabel, & Kartu Galeri Tetap Utuh */
        img, figure, table, tr, blockquote, #proj-gallery > div, .gallery-card {
            break-inside: avoid !important;

        }

        img {
            max-height: 290px !important;
            width: auto !important;
            max-width: 100% !important;
            object-fit: contain !important;
            margin: 10px auto !important;
            border: 1px solid #E5E7EB !important;
            border-radius: 10px !important;
        }

        /* Rapikan Grid Galeri jadi 2 Kolom Rapi di Kertas A4 */
        #proj-gallery {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 12px !important;
        }

        /* Rapikan Tabel agar Header Ulang di Halaman Baru jika Panjang */
        table {
            width: 100% !important;
            border: 1px solid #D1D5DB !important;
            font-size: 9.5pt !important;
            box-shadow: none !important;
        }
        thead { display: table-header-group !important; }
        th {

        td {
            padding: 7px 10px !important;
            border-bottom: 1px solid #E5E7EB !important;
        }
    }
</style>

<script>
    function exportCaseStudyPDF() {
        // 1. Sisipkan Kop Resmi sementara sebelum cetak
        if (!document.querySelector('.pdf-formal-header')) {
            const pdfHeader = document.createElement('div');
            pdfHeader.className = 'pdf-formal-header';
            const today = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
            pdfHeader.innerHTML = `
                <span><strong>MUHAMMAD ZIDAN</strong> &bull; Portfolio Case Study</span>
                <span>Generated on ${today}</span>
            `;
            document.body.prepend(pdfHeader);
        }

        // 2. Pastikan semua gambar selesai dimuat sebelum dialog PDF muncul
        window.print();
    }

    // Otomatis tambahkan tombol "Save PDF" ke Bar Pil Navigasi Atas
    window.addEventListener('DOMContentLoaded', () => {
        const topNav = document.querySelector('.apple-nav, .apple-top-nav');
        if (topNav && !document.getElementById('nav-pdf-btn')) {
            const ctaBtn = topNav.querySelector('a:last-child');
            const btnWrap = document.createElement('div');
            btnWrap.style.cssText = 'display: inline-flex; align-items: center; gap: 8px;';

            const pdfBtn = document.createElement('button');
            pdfBtn.id = 'nav-pdf-btn';
            pdfBtn.type = 'button';
            pdfBtn.className = 'apple-pdf-btn';
            pdfBtn.onclick = exportCaseStudyPDF;
            pdfBtn.innerHTML = `<i class='bx bxs-file-pdf' style="font-size:15px;"></i> Save PDF`;

            if (ctaBtn) {
                ctaBtn.parentNode.insertBefore(btnWrap, ctaBtn);
                btnWrap.appendChild(pdfBtn);
                btnWrap.appendChild(ctaBtn);
            } else {
                topNav.appendChild(pdfBtn);
            }
        }
    });
</script>
